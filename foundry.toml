[profile.default]
src = "src"
out = "out"
test = "tests"
script = "scripts"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = true
fs_permissions = [{ access = "read-write", path = "./reports" }]

[lint]
lint_on_build = false

[fuzz]
runs = 1000
seed = "0x640"

[rpc_endpoints]
mainnet = "${RPC_MAINNET}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chainId = 1 }
