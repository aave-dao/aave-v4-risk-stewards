[profile.default]
src = "src"
out = "out"
test = "tests"
script = "scripts"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = true
bytecode_hash = "none"
fs_permissions = [
  { access = "read-write", path = "./reports" },
  { access = "read-write", path = "./diffs" },
]

[lint]
lint_on_build = false

[fuzz]
runs = 1000
seed = "0x640"

[rpc_endpoints]
mainnet = "${RPC_MAINNET}"
avalanche = "${RPC_AVALANCHE}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chainId = 1 }
avalanche = { key = "${ETHERSCAN_API_KEY}", chainId = 43114 }
